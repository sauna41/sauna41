<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Joulukalenteri</title>

  <!-- CSS omassa tiedostossaan -->
  <link rel="stylesheet" href="kalenteri.css">


</head>
<body>
  <button id="playMusic" >♫</button>
  <div class="container">
    <h1>Joulukalenteri</h1>
    <div class="calendar" id="calendar"></div>
  </div>

  <script>
    // Luodaan kalenteri (luukut 1–24) JavaScriptillä
    const calendar = document.getElementById('calendar');

    for (let paiva = 1; paiva <= 24; paiva++) {
      const btn = document.createElement('button');
      btn.className = 'door';
      btn.textContent = paiva;
      btn.setAttribute('data-day', paiva);

      // Kun klikataan, yritetään avata popup-ikkuna
      btn.addEventListener('click', () => {
        const popupWidth = 360;
        const popupHeight = 240;
        // Lasketaan keskitetyn popupin sijainti
        const left = (screen.width / 2) - (popupWidth / 2);
        const top = (screen.height / 2) - (popupHeight / 2);

        const popup = window.open('', `luukku-${paiva}`, `width=${popupWidth},height=${popupHeight},left=${left},top=${top},resizable=no`);

        if (popup) {
          // Kirjoitetaan yksinkertainen sisältö popupiin
          popup.document.title = `Luukku ${paiva}`;
          popup.document.body.style.fontFamily = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial';
          popup.document.body.style.display = 'flex';
          popup.document.body.style.alignItems = 'center';
          popup.document.body.style.justifyContent = 'center';
          popup.document.body.style.height = '100vh';
          popup.document.body.style.margin = '0';
          popup.document.body.innerHTML = `
            <div style="text-align:center; padding:16px;">
              <h2 style="margin:0 0 8px 0;">Luukku ${paiva}</h2>
              <p style="margin:0 0 12px 0;">Avasit luukun ${paiva}!
              Enää ${24-paiva} päivää jouluun :)</p>
              <button id="closeBtn" style="padding:8px 12px; border-radius:6px; border:1px solid #bbb;">Sulje</button>
            </div>
          `;

          // Sulje-nappi sulkee pop-upin
          popup.document.getElementById('closeBtn').addEventListener('click', () => popup.close());

        }
      });

      calendar.appendChild(btn);
    }
      const musiikki = new Audio("joulumusiikki.mp3");
    document.getElementById("playMusic").addEventListener("click", () => {
    if (musiikki.paused) {
      musiikki.play();
    } else {
      musiikki.pause();
  }
});
  </script>
</body>
</html>
